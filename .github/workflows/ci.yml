name: CI - Build and Push Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]        # push tag dạng v1.0.0, v2.1.3... cũng kích hoạt

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag          # push tag v1.0.0 → image :v1.0.0
            type=sha                     # mọi lần chạy → image :sha-abc1234
            type=raw,value=latest,enable={{is_default_branch}}   # chỉ main mới được :latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}